name: Expand RCC catalog

on:
  workflow_dispatch:
    inputs:
      community_target:
        description: "Cantidad objetivo de publicaciones nuevas (gratuitas, recientes y no parcheadas)"
        required: true
        type: number
        default: 1200

permissions:
  contents: write

concurrency:
  group: rcc-catalog-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Import new community metadata
        run: node tools/import-community.cjs "${{ inputs.community_target }}"
      - name: Validate catalog and Java examples
        run: npm test
        env:
          RCC_REQUIRE_JAVA: "1"
      - name: Commit expanded catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts.json catalog/ netlify/functions/lib/catalog-ids.json
          if git diff --cached --quiet; then
            echo "No new catalog entries passed the import filters."
          else
            git commit -m "feat(catalog): import recent community scripts"
            git push
          fi
