name: RCC Bulk Catalog Import

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum pages to request from each source
        required: false
        default: "25"
      target:
        description: Maximum new catalog entries per run
        required: false
        default: "1500"
      include_code:
        description: Attempt to import source code (filtered; never executed)
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: rcc-bulk-catalog-import
  cancel-in-progress: false

jobs:
  bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate catalog before import
        run: node -e "const s=require('./tools/catalog-store.cjs'); const rows=s.readCatalog(); console.log('Catalog valid:', rows.length, 'entries');"

      - name: Import public Roblox script listings
        env:
          RCC_BULK_MAX_PAGES: ${{ inputs.max_pages || '25' }}
          RCC_BULK_TARGET: ${{ inputs.target || '1500' }}
          RCC_BULK_IMPORT_INCLUDE_CODE: ${{ (github.event_name == 'schedule' || inputs.include_code == true) && '1' || '0' }}
          RCC_BULK_DELAY_MS: "1000"
          RSCRIPTS_API_KEY: ${{ secrets.RSCRIPTS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RCC_BULK_SOURCE_URLS: ${{ vars.RCC_BULK_SOURCE_URLS }}
        run: node tools/bulk-import.cjs

      - name: Validate generated catalog and 2 MB parts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const store = require('./tools/catalog-store.cjs');
          const rows = store.readCatalog();
          const manifest = JSON.parse(fs.readFileSync('scripts.json', 'utf8'));
          if (manifest.total !== rows.length) throw new Error('Manifest total mismatch');
          for (const part of manifest.parts) {
            const fullPath = path.join(process.cwd(), part.file);
            const size = fs.statSync(fullPath).size;
            if (size > store.MAX_PART_BYTES) throw new Error(part.file + ' exceeds 2 MB');
            if (size !== part.bytes) throw new Error(part.file + ' byte count mismatch');
          }
          console.log('Catalog verified:', rows.length, 'entries;', manifest.parts.length, 'parts.');
          NODE

      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts.json catalog/ netlify/functions/lib/catalog-ids.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore(catalog): bulk import public Roblox scripts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
