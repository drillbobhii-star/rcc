name: RCC Cleanup Placeholder Catalog

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply deletion (false = dry run only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rcc-catalog-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preview or remove placeholder-only entries
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            node tools/cleanup-placeholder-scripts.cjs --apply
          else
            node tools/cleanup-placeholder-scripts.cjs
          fi

      - name: Commit cleaned catalog
        if: inputs.apply
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts.json catalog/ netlify/functions/lib/catalog-ids.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "chore(catalog): remove link-only placeholder entries"
          git push origin main
