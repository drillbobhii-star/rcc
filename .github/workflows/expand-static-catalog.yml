name: RCC Catalog Expansion
# Manual refresh trigger: this workflow also runs on matching main-branch updates.

on:
  workflow_dispatch:
    inputs:
      scriptblox_target:
        description: Maximum number of new free ScriptBlox listings to import
        required: true
        default: "10000"
        type: string
      rscripts_target:
        description: Maximum number of new free low-risk RScripts listings to import
        required: true
        default: "3000"
        type: string
      fivem_target:
        description: Maximum number of public FiveM resource cards to index from Cfx.re
        required: true
        default: "1200"
        type: string
      robloxscripts_target:
        description: Maximum number of free public RobloxScripts.com listings to index
        required: true
        default: "10000"
        type: string
      greasyfork_target:
        description: Maximum number of JavaScript userscript metadata cards to index from Greasy Fork
        required: true
        default: "2500"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-static-catalog.yml"
      - "tools/import-robloxscripts.cjs"
      - "tools/check-robloxscripts-import.mjs"
      - "tools/import-github-resources.cjs"
      - "tools/check-github-resource-import.mjs"
      - "tools/import-greasyfork.cjs"
      - "tools/check-greasyfork-import.mjs"
      - "tools/tag-rcc-catalog.cjs"
      - "tools/check-rcc-tags.mjs"
  schedule:
    - cron: "31 11 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rcc-catalog-expansion
  cancel-in-progress: false

jobs:
  expand:
    name: Import, validate and propose catalog growth
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out RCC
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Repair catalog part checksums before importing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('scripts.json', 'utf8'));
          if (!manifest || manifest.format !== 'rcc-catalog-v1' || !Array.isArray(manifest.parts)) {
            throw new Error('Unexpected RCC catalog manifest format');
          }
          const repaired = [];
          for (const part of manifest.parts) {
            const oldPath = path.join('.', part.file);
            const raw = fs.readFileSync(oldPath);
            const rows = JSON.parse(raw.toString('utf8'));
            if (!Array.isArray(rows) || rows.length !== part.count) {
              throw new Error('Catalog part content/count mismatch: ' + part.file);
            }
            const hash = crypto.createHash('sha256').update(raw).digest('hex').slice(0, 16);
            const file = part.file.replace(/-[a-f0-9]{16}\.json$/, '-' + hash + '.json');
            const nextPath = path.join('.', file);
            if (nextPath !== oldPath) fs.renameSync(oldPath, nextPath);
            repaired.push({ file, count: rows.length, bytes: raw.length });
          }
          const allIds = new Set();
          let total = 0;
          for (const part of repaired) {
            const rows = JSON.parse(fs.readFileSync(path.join('.', part.file), 'utf8'));
            for (const row of rows) {
              if (!row || !row.id || allIds.has(row.id)) throw new Error('Missing or duplicate catalog ID: ' + (row && row.id));
              allIds.add(row.id);
            }
            total += rows.length;
          }
          if (total !== manifest.total) throw new Error('Catalog manifest total mismatch: ' + total + ' != ' + manifest.total);
          manifest.parts = repaired;
          fs.writeFileSync('scripts.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log('Catalog checksums normalized; validated ' + total + ' existing records.');
          NODE

      - name: Import recent free ScriptBlox publications
        env:
          TARGET: ${{ inputs.scriptblox_target || '10000' }}
        run: node tools/import-community.cjs "$TARGET"

      - name: Import public free RobloxScripts.com listings
        env:
          TARGET: ${{ inputs.robloxscripts_target || '10000' }}
          RCC_ROBLOXSCRIPTS_MAX_PAGES: "200"
        run: node tools/import-robloxscripts.cjs "$TARGET"

      - name: Import public low-risk RScripts listings
        env:
          TARGET: ${{ inputs.rscripts_target || '3000' }}
          RSCRIPTS_API_KEY: ${{ secrets.RSCRIPTS_API_KEY }}
        run: node tools/import-public-games.cjs "$TARGET"

      - name: Generate the 48 reviewed Java examples
        run: node tools/expand-java.cjs

      - name: Add the 36 original Java learning examples
        run: node tools/import-java-library.cjs

      - name: Import public FiveM resource cards from Cfx.re
        env:
          TARGET: ${{ inputs.fivem_target || '1200' }}
          RCC_FIVEM_MAX_PAGES: "120"
        run: node tools/import-fivem.cjs "$TARGET"

      - name: Index source files across seven RCC catalogs
        env:
          GH_TOKEN: ${{ github.token }}
          RCC_GITHUB_FILES_PER_REPO: "25"
          RCC_GITHUB_CODE_FETCH_LIMIT: "1800"
        run: node tools/import-github-resources.cjs

      - name: Import public Greasy Fork JavaScript userscript metadata
        env:
          TARGET: ${{ inputs.greasyfork_target || '2500' }}
          RCC_GREASYFORK_TARGET: ${{ inputs.greasyfork_target || '2500' }}
          RCC_GREASYFORK_MAX_PAGES: "50"
        run: node tools/import-greasyfork.cjs "$TARGET"

      - name: Apply RCC tag to every catalog entry
        run: node tools/tag-rcc-catalog.cjs

      - name: Validate Java examples with javac
        run: npm run test:java

      - name: Run RCC regression suite
        run: npm test

      - name: Create a reviewable catalog pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/rcc-catalog-expansion
          delete-branch: true
          add-paths: |
            catalog/
            scripts.json
            netlify/functions/lib/catalog-ids.json
          commit-message: "chore: expand RCC catalog with fresh scripts and Java examples"
          title: "RCC catalog expansion: new scripts + Java library"
          body: |
            ## RCC catalog growth

            This automated proposal imports recent public free listings from ScriptBlox and RobloxScripts.com, optional low-risk RScripts metadata, Cfx.re FiveM release cards, reviewed original Java examples, source-linked files discovered across seven platform repositories, and read-only Greasy Fork metadata for JavaScript userscripts.

            - ScriptBlox and RobloxScripts.com listings are deduplicated by source ID and canonical URL; paid and suspicious-title entries are skipped. RobloxScripts.com is credited visibly and rate-limited according to its public API documentation.
            - RScripts listings require the configured RSCRIPTS_API_KEY secret; only public, free, non-patched entries marked Safe or Low Risk, with a numeric score from 1 to 4 and no detected obfuscation, are considered.
            - Third-party repository files are indexed as source-only cards with a direct HTTPS link. RCC does not download, copy, rehost or execute their code. Repository licence and source metadata are retained for review.
            - GameGuardian discovery is deliberately limited to tutorials, templates and documentation; cheat, bypass, anti-ban, exploit, deobfuscation and account-theft repositories are excluded.
            - Greasy Fork metadata cards are paginated through its read-only JSON API. Script source is not downloaded or rehosted, and suspicious descriptions are filtered.
            - Roblox public tags omit provider names for the new Studio index; any third-party source that legally requires attribution retains it.
            - Original Java examples are compiled individually with JDK 21 using the Java validation script.
            - The complete RCC regression suite must pass before this PR is created.

            Review the import counts in the Actions log. Some requests may add fewer items than the configured target because records are duplicates or fail the source filters.
