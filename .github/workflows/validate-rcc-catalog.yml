name: Validate RCC catalog, assistant and discovery feed

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "catalog/**"
      - "community-feed.json"
      - "scripts.json"
      - "tools/**"
      - "docs/**"
      - "rocio-informacion.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main, feat/rcc-universal-catalog-assistant-2026-11-17]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Run RCC regression suite
        run: npm test
        env:
          RCC_REQUIRE_JAVA: "1"
