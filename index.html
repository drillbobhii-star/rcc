<!DOCTYPE html>
<html lang="es">
<head>
<!-- ETIQUETA DE VERIFICACIÓN DE MONETAG (NO BORRAR) -->
<meta name="monetag" content="e44ff31eaa440a1710ce15a33c12a881">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCC — Scripts Lua</title>
<style>
  :root{
    --bg:#0a0a12; --bg2:#12121f; --card:#16162a; --border:#26264a;
    --text:#e8e8f5; --muted:#8b8ba8;
    --accent:#7c5cff; --accent2:#00e5ff;
    --free:#22c55e;
    --pc:#00e5ff; --mobile:#ff9500; --both:#a855f7;
    --sidebar-w:240px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh}
  
  /* FONDO ANIMADO PERSONALIZADO */
  .bg-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 45vw;
    font-weight: 900;
    color: rgba(124, 92, 255, 0.04);
    filter: blur(15px);
    z-index: 0;
    pointer-events: none;
    white-space: nowrap;
    animation: pulseBg 8s infinite alternate;
  }
  @keyframes pulseBg {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.25; z-index: 0; pointer-events: none; }
  .blob1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; animation: float1 14s infinite ease-in-out; }
  .blob2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation: float2 18s infinite ease-in-out; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(80px, 60px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-70px, -50px); } }

  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  .sidebar{width:var(--sidebar-w);background:#12121f;border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:1001;display:flex;flex-direction:column;padding:20px 0;overflow-y:auto;transition:transform .3s ease}
  .sidebar::-webkit-scrollbar{width:6px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .brand{padding:0 20px 20px;border-bottom:1px solid var(--border)}
  .brand h1{font-size:1.5rem;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{color:var(--muted);font-size:.65rem;letter-spacing:3px;display:block;margin-top:2px}
  .device-toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:16px 14px;padding:4px;background:var(--bg);border-radius:12px;border:1px solid var(--border)}
  .dev-btn{padding:9px 0;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;border-radius:8px;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .dev-btn:hover{color:var(--text)}
  .dev-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 0 15px rgba(124,92,255,.4)}
  .dev-btn.active[data-dev="pc"]{background:linear-gradient(135deg,#0080a8,#00e5ff);box-shadow:0 0 15px rgba(0,229,255,.4)}
  .dev-btn.active[data-dev="mobile"]{background:linear-gradient(135deg,#e07000,#ff9500);box-shadow:0 0 15px rgba(255,149,0,.4)}
  .dev-btn .ico{font-size:1rem}
  .sidebar-section{padding:8px 14px}
  .sidebar-title{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;padding:12px 6px 8px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.87rem;transition:.25s;position:relative}
  .nav-item:hover{background:rgba(124,92,255,.08);color:var(--text)}
  .nav-item.active{background:linear-gradient(90deg,rgba(124,92,255,.2),rgba(0,229,255,.08));color:var(--text);font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:3px}
  .nav-item .ico{font-size:1.05rem;width:20px;text-align:center}
  .nav-item .count{margin-left:auto;font-size:.7rem;background:var(--bg);padding:2px 7px;border-radius:6px;color:var(--muted)}
  .group-header{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:12px 12px 6px;font-weight:700;opacity:.7;display:flex;align-items:center;gap:8px}
  .group-header::after{content:"";flex:1;height:1px;background:var(--border)}
  .main{flex:1;margin-left:var(--sidebar-w);min-width:0;transition:margin-left .3s ease}
  header{position:sticky;top:0;z-index:50;background:rgba(10,10,18,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar{max-width:1300px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
  .hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1.2rem}
  .search-top{flex:1;position:relative}
  .search-top input{width:100%;padding:12px 44px 12px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:.92rem;outline:none;transition:.3s}
  .search-top input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .search-top svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
  .btn-free{background:linear-gradient(90deg,var(--free),#16a34a);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-weight:800;font-size:.82rem;cursor:pointer;transition:.3s;white-space:nowrap}
  .btn-free:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,197,94,.4)}
  .hero{max-width:1300px;margin:auto;padding:36px 24px 8px;position:relative;z-index:1}
  .hero h2{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;background:linear-gradient(90deg,#fff,var(--accent),var(--accent2));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .hero p{color:var(--muted);margin-top:8px;font-size:.95rem}
  .stats{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap}
  .stat b{display:block;font-size:1.4rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat small{color:var(--muted);font-size:.7rem;letter-spacing:1px;text-transform:uppercase}
  .active-filters{max-width:1300px;margin:auto;padding:16px 24px 0;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
  .chip{background:rgba(124,92,255,.15);border:1px solid rgba(124,92,255,.3);color:#a89bff;padding:5px 12px;border-radius:999px;font-size:.75rem;display:flex;align-items:center;gap:6px}
  .chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0}
  .grid{max-width:1300px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;position:relative;z-index:1}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:.35s cubic-bezier(.2,.8,.2,1);opacity:0;transform:translateY(20px);position:relative;overflow:hidden}
  .card.show{opacity:1;transform:translateY(0)}
  .card:hover{transform:translateY(-5px);border-color:var(--free);box-shadow:0 12px 35px rgba(34,197,94,.2)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
  .badges{display:flex;gap:5px;flex-wrap:wrap}
  .badge{padding:3px 8px;border-radius:6px;font-size:.62rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:3px}
  .badge.free{background:rgba(34,197,94,.15);color:var(--free)}
  .badge.pc{background:rgba(0,229,255,.15);color:var(--pc)}
  .badge.mobile{background:rgba(255,149,0,.15);color:var(--mobile)}
  .badge.both{background:rgba(168,85,247,.15);color:var(--both)}
  .card h3{font-size:1.05rem;margin-bottom:6px;line-height:1.3}
  .card .desc{color:var(--muted);font-size:.83rem;line-height:1.5;min-height:40px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tag{font-size:.68rem;padding:3px 9px;border-radius:6px;background:rgba(124,92,255,.12);color:#a89bff}
  .tag.exec{background:rgba(0,229,255,.1);color:#7be5ff}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}
  .ver{color:var(--accent2);font-weight:700}
  .card-action{margin-top:12px;width:100%;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:.82rem;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff}
  .card-action:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .ad-banner{max-width:1300px;margin:20px auto 0;padding:0 24px;position:relative;z-index:1}
  .ad-box{background:linear-gradient(135deg,#1a1a2e,#16162a);border:1px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:.82rem;position:relative;min-height:70px;display:flex;align-items:center;justify-content:center}
  .ad-box::before{content:"PUBLICIDAD";position:absolute;top:5px;left:10px;font-size:.55rem;letter-spacing:2px;color:#444}
  .modal{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.85)}
  .modal.open{display:flex}
  .modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:18px;max-width:820px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal-head h3{font-size:1.1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .modal-body{overflow-y:auto;padding:18px 22px 22px}
  .close{background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer;transition:.3s;line-height:1}
  .close:hover{color:#ff5c7c;transform:rotate(90deg)}
  pre{background:#0d0d18;border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;font-family:Consolas,monospace;font-size:.83rem;line-height:1.6;color:#c9d1ff;position:relative;white-space:pre-wrap;word-break:break-word}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;transition:.3s}
  .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;flex:1}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn:hover{transform:translateY(-2px)}
  .toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,100px);background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:13px 24px;border-radius:12px;font-weight:700;z-index:2100;transition:.4s;box-shadow:0 10px 30px rgba(124,92,255,.5);max-width:90%}
  .toast.show{transform:translate(-50%,0)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none}
  .overlay.show{display:block}
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .hamburger{display:flex;align-items:center;justify-content:center}
    .topbar{padding:12px 16px}
    .btn-free{padding:10px 14px;font-size:.75rem}
    .hero{padding:24px 16px 8px}
    .grid{padding:20px 16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .active-filters{padding:12px 16px 0}
    .ad-banner{padding:0 16px}
    .bg-text{font-size: 70vw;}
  }
  @media(max-width:480px){
    .grid{grid-template-columns:1fr}
    .stats{gap:16px}
  }
</style>
</head>
<body>

<div class="bg-text">RCC</div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <h1>RCC</h1>
    <small>LUA SCRIPTS</small>
  </div>
  <div class="device-toggle">
    <button class="dev-btn active" data-dev="all"><span class="ico">🌐</span>Todos</button>
    <button class="dev-btn" data-dev="pc"><span class="ico">🖥️</span>PC</button>
    <button class="dev-btn" data-dev="mobile"><span class="ico">📱</span>Móvil</button>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">Plataformas</div>
    <div id="platformList"></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">Ejecutores</div>
    <div id="executorList"></div>
  </div>
</aside>

<div class="app">
  <div class="main">
    <header>
      <div class="topbar">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="search-top">
          <input type="text" id="search" placeholder="Buscar script, ejecutor o etiqueta...">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <button class="btn-free">🎁 Gratis</button>
      </div>
    </header>
    <section class="hero">
      <h2>Scripts Lua por RCC</h2>
      <p>Scripts gratuitos listos para pegar en tus proyectos. Todos gratis.</p>
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><small>Scripts</small></div>
        <div class="stat"><b id="statPC">0</b><small>🖥️ PC</small></div>
        <div class="stat"><b id="statMobile">0</b><small>📱 Móvil</small></div>
      </div>
    </section>
    <div class="active-filters" id="activeFilters"></div>
    <div class="ad-banner">
      <div class="ad-box">📢 Espacio publicitario</div>
    </div>
    <div class="grid" id="scripts">
      <div class="loading">⏳ Cargando scripts desde GitHub...</div>
    </div>
    <div class="ad-banner" style="margin-bottom:40px">
      <div class="ad-box">📢 Espacio publicitario</div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Script</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast">¡Copiado!</div>

<script>
let scripts = [];
let filterDevice = 'all';
let filterPlatform = 'all';
let filterExecutor = 'all';

const PLATFORMS = [
  { id:'roblox',      name:'Roblox',       icon:'🎮' },
  { id:'fivem',       name:'FiveM',        icon:'🚗' },
  { id:'gameguardian',name:'GameGuardian', icon:'🕹️' },
  { id:'autotouch',   name:'AutoTouch',    icon:'📱' },
  { id:'universal',   name:'Universal',    icon:'⚙️' },
];

const EXECUTORS = {
  pc:     ['Solara','Wave','Xeno','Hydrogen','Nihon'],
  mobile: ['Delta','Fluxus','Arceus X','Codex','Vega X']
};

const DEVICE_ICON = { pc:'🖥️', mobile:'📱', both:'🌐' };
const DEVICE_LABEL= { pc:'PC', mobile:'Móvil', both:'Ambos' };

const grid = document.getElementById('scripts');
const searchInput = document.getElementById('search');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const platformList = document.getElementById('platformList');
const executorList = document.getElementById('executorList');
const activeFilters = document.getElementById('activeFilters');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

async function loadScripts(){
  try {
    const res = await fetch('scripts.json');
    if(!res.ok) throw new Error('No se encontró el archivo scripts.json');
    
    scripts = await res.json();
    buildSidebar();
    render();
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="empty">❌ Error al cargar: ' + err.message + '<br><small>Asegúrate de haber creado el archivo scripts.json</small></div>';
  }
}

function buildSidebar(){
  platformList.innerHTML = '';
  const allP = document.createElement('div');
  allP.className = 'nav-item' + (filterPlatform==='all'?' active':'');
  allP.innerHTML = `<span class="ico">📁</span>Todas<span class="count">${scripts.length}</span>`;
  allP.onclick = ()=>{ filterPlatform='all'; buildSidebar(); render(); };
  platformList.appendChild(allP);
  PLATFORMS.forEach(p=>{
    const count = scripts.filter(s=>s.platform===p.id).length;
    const item = document.createElement('div');
    item.className = 'nav-item' + (filterPlatform===p.id?' active':'');
    item.innerHTML = `<span class="ico">${p.icon}</span>${p.name}<span class="count">${count}</span>`;
    item.onclick = ()=>{ filterPlatform=p.id; buildSidebar(); render(); closeSidebar(); };
    platformList.appendChild(item);
  });

  executorList.innerHTML = '';
  const allE = document.createElement('div');
  allE.className = 'nav-item' + (filterExecutor==='all'?' active':'');
  allE.innerHTML = `<span class="ico">⚡</span>Todos`;
  allE.onclick = ()=>{ filterExecutor='all'; buildSidebar(); render(); };
  executorList.appendChild(allE);

  function renderGroup(devKey, label){
    const execs = EXECUTORS[devKey] || [];
    const visible = execs.filter(e => scripts.some(s => (s.executors||[]).includes(e)));
    if(visible.length === 0) return;
    const h = document.createElement('div');
    h.className = 'group-header';
    h.textContent = label;
    executorList.appendChild(h);
    visible.forEach(e=>{
      const count = scripts.filter(s=>(s.executors||[]).includes(e)).length;
      const item = document.createElement('div');
      item.className = 'nav-item' + (filterExecutor===e?' active':'');
      item.innerHTML = `<span class="ico">⚡</span>${e}<span class="count">${count}</span>`;
      item.onclick = ()=>{ filterExecutor=e; buildSidebar(); render(); closeSidebar(); };
      executorList.appendChild(item);
    });
  }
  if(filterDevice === 'all'){ renderGroup('pc','🖥️ PC'); renderGroup('mobile','📱 Móvil'); }
  else if(filterDevice === 'pc'){ renderGroup('pc','🖥️ PC'); }
  else if(filterDevice === 'mobile'){ renderGroup('mobile','📱 Móvil'); }
}

document.querySelectorAll('.dev-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.dev-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filterDevice = btn.dataset.dev;
    filterExecutor = 'all';
    buildSidebar(); render();
  };
});

function renderActiveFilters(){
  activeFilters.innerHTML = '';
  const add = (label, clear) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${label}<button>×</button>`;
    chip.querySelector('button').onclick = clear;
    activeFilters.appendChild(chip);
  };
  if(filterDevice!=='all'){
    add(DEVICE_ICON[filterDevice]+' '+DEVICE_LABEL[filterDevice], ()=>{
      filterDevice='all';
      document.querySelectorAll('.dev-btn').forEach(b=>b.classList.toggle('active', b.dataset.dev==='all'));
      buildSidebar(); render();
    });
  }
  if(filterPlatform!=='all'){
    const p = PLATFORMS.find(x=>x.id===filterPlatform);
    add(p.icon+' '+p.name, ()=>{ filterPlatform='all'; buildSidebar(); render(); });
  }
  if(filterExecutor!=='all'){
    add('⚡ '+filterExecutor, ()=>{ filterExecutor='all'; buildSidebar(); render(); });
  }
}

function render(){
  const q = searchInput.value.toLowerCase().trim();
  const list = scripts.filter(s=>{
    const okDev = filterDevice==='all' || s.device===filterDevice || s.device==='both';
    const okPlat = filterPlatform==='all' || s.platform===filterPlatform;
    const okExec = filterExecutor==='all' || (s.executors||[]).includes(filterExecutor);
    const okTxt = !q ||
      s.name.toLowerCase().includes(q) ||
      (s.description||'').toLowerCase().includes(q) ||
      (s.tags||[]).some(t=>t.toLowerCase().includes(q)) ||
      (s.executors||[]).some(e=>e.toLowerCase().includes(q));
    return okDev && okPlat && okExec && okTxt;
  });
  document.getElementById('statTotal').textContent = scripts.length;
  document.getElementById('statPC').textContent = scripts.filter(s=>s.device==='pc'||s.device==='both').length;
  document.getElementById('statMobile').textContent = scripts.filter(s=>s.device==='mobile'||s.device==='both').length;
  renderActiveFilters();
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty">🔍 No se encontraron scripts</div>';
    return;
  }
  list.forEach((s,i)=>{
    const plat = PLATFORMS.find(p=>p.id===s.platform);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="badges">
          <span class="badge free">🟢 FREE</span>
          <span class="badge ${s.device}">${DEVICE_ICON[s.device]} ${DEVICE_LABEL[s.device]}</span>
        </div>
      </div>
      <h3>${plat ? plat.icon+' ' : ''}${s.name}</h3>
      <p class="desc">${s.description || ''}</p>
      <div class="tags">
        ${(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
        ${(s.executors||[]).slice(0,3).map(e=>`<span class="tag exec">⚡${e}</span>`).join('')}
        ${(s.executors||[]).length>3 ? `<span class="tag exec">+${s.executors.length-3}</span>` : ''}
      </div>
      <div class="meta">
        <span>📅 ${(s.created_at||'').slice(0,7)}</span>
        <span class="ver">v${s.version}</span>
      </div>
      <button class="card-action">📋 Ver y copiar</button>
    `;
    card.onclick = (e)=>{ e.stopPropagation(); openScript(s); };
    grid.appendChild(card);
    setTimeout(()=>card.classList.add('show'), i*60);
  });
}

function openScript(s){
  const plat = PLATFORMS.find(p=>p.id===s.platform);
  modalTitle.innerHTML = `🟢 ${s.name} <span style="color:var(--muted);font-size:.8rem">v${s.version}</span>`;
  modalBody.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge ${s.device}">${DEVICE_ICON[s.device]} ${DEVICE_LABEL[s.device]}</span>
      <span class="badge free">🟢 FREE</span>
      ${plat?`<span class="badge" style="background:rgba(124,92,255,.15);color:#a89bff">${plat.icon} ${plat.name}</span>`:''}
    </div>
    <p style="color:var(--muted);margin-bottom:14px;font-size:.88rem">${s.description||''}</p>
    <div style="margin-bottom:12px">
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Ejecutores compatibles</div>
      <div class="tags">${(s.executors||[]).map(e=>`<span class="tag exec">⚡ ${e}</span>`).join('')}</div>
    </div>
    <pre><code id="modalCode"></code></pre>
    <div class="actions">
      <button class="btn btn-primary" onclick="copyCode()">📋 Copiar código</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
    </div>
  `;
  document.getElementById('modalCode').textContent = s.code;
  
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function copyCode(){
  navigator.clipboard.writeText(document.getElementById('modalCode').textContent).then(()=> showToast('📋 ¡Copiado!'));
}
function closeModal(){ modal.classList.remove('open'); document.body.style.overflow=''; }
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('hamburger').onclick = openSidebar;
overlay.onclick = closeSidebar;

searchInput.addEventListener('input', render);

// Iniciar
loadScripts();
</script>

</body>
</html>
