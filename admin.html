<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCC - Generador de Scripts</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: #e8e8f5; padding: 20px; }
  .container { max-width: 800px; margin: auto; background: #12121f; padding: 20px; border-radius: 12px; border: 1px solid #26264a; }
  h1 { color: #7c5cff; text-align: center; }
  label { display: block; margin-top: 15px; font-size: 0.9rem; color: #8b8ba8; }
  input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #16162a; border: 1px solid #26264a; color: #fff; border-radius: 8px; outline: none; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: #7c5cff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  button { width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(90deg, #16a34a, #22c55e); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #resultado { width: 100%; height: 200px; margin-top: 20px; display: none; background: #0d0d18; color: #00e5ff; font-family: monospace; }
  .btn-copy { background: linear-gradient(90deg, #7c5cff, #00e5ff); margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="container">
  <h1>🛠️ Panel de Administrador RCC</h1>
  <p style="text-align:center; color:#8b8ba8; font-size:0.9rem;">Llena los datos, genera el código y pégalo en tu archivo <b>scripts.json</b>.</p>

  <label>Nombre del Script</label>
  <input type="text" id="fName" placeholder="Ej: AutoFarm Pro">

  <label>Descripción corta</label>
  <textarea id="fDesc" rows="2" placeholder="¿Qué hace este script?"></textarea>

  <div class="row">
    <div>
      <label>Plataforma</label>
      <select id="fPlatform">
        <option value="roblox">Roblox</option>
        <option value="fivem">FiveM</option>
        <option value="gameguardian">GameGuardian</option>
        <option value="autotouch">AutoTouch</option>
        <option value="universal">Universal</option>
      </select>
    </div>
    <div>
      <label>Dispositivo</label>
      <select id="fDevice">
        <option value="pc">PC</option>
        <option value="mobile">Móvil</option>
        <option value="both">Ambos</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Ejecutores (separados por coma)</label>
      <input type="text" id="fExec" placeholder="Solara, Wave, Delta">
    </div>
    <div>
      <label>Tags (separados por coma)</label>
      <input type="text" id="fTags" placeholder="Farm, Auto, OP">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Versión</label>
      <input type="text" id="fVersion" value="1.0">
    </div>
    <div>
      <label>ID (Se genera solo)</label>
      <input type="text" id="fId" readonly style="color:#8b8ba8;">
    </div>
  </div>

  <label>Código Lua</label>
  <textarea id="fCode" rows="6" placeholder="-- Pega tu código Lua aquí"></textarea>

  <button onclick="generarJSON()">Generar Código JSON</button>
  <button class="btn-copy" id="btnCopy" onclick="copiarJSON()">📋 Copiar JSON</button>

  <textarea id="resultado" readonly></textarea>
</div>

<script>
  // Generar un ID aleatorio al cargar
  document.getElementById('fId').value = Math.random().toString(36).substring(2, 9);

  function generarJSON() {
    const name = document.getElementById('fName').value.trim();
    const desc = document.getElementById('fDesc').value.trim();
    const code = document.getElementById('fCode').value.trim();
    
    if(!name || !code) {
      alert("⚠️ El nombre y el código son obligatorios.");
      return;
    }

    // Formatear arrays
    const execString = document.getElementById('fExec').value;
    const execArray = execString ? execString.split(',').map(s => s.trim()) : [];
    
    const tagsString = document.getElementById('fTags').value;
    const tagsArray = tagsString ? tagsString.split(',').map(s => s.trim()) : [];

    // Crear el objeto
    const scriptObj = {
      id: document.getElementById('fId').value,
      name: name,
      description: desc,
      level: "free",
      device: document.getElementById('fDevice').value,
      platform: document.getElementById('fPlatform').value,
      executors: execArray,
      tags: tagsArray,
      version: document.getElementById('fVersion').value || "1.0",
      created_at: new Date().toISOString().slice(0, 10), // YYYY-MM-DD
      code: code
    };

    // Convertir a JSON bonito
    const jsonString = JSON.stringify(scriptObj, null, 2);
    
    const resBox = document.getElementById('resultado');
    resBox.value = jsonString;
    resBox.style.display = 'block';
    document.getElementById('btnCopy').style.display = 'block';
  }

  function copiarJSON() {
    const resBox = document.getElementById('resultado');
    resBox.select();
    document.execCommand('copy');
    alert("✅ ¡Copiado! Ahora ve a tu scripts.json en GitHub, pon una coma al final del último script y pega esto.");
  }
</script>

</body>
</html>
